<!DOCTYPE HTML>
<html>

<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
	<title>Login &ndash; Open EPaper Link</title>
	<script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('preload-dark');</script>
	<link rel="stylesheet" href="main.css?2.80" type="text/css" />
	<link rel="stylesheet"
		  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
	<header>
		<div class="logo">Open EPaper Link Access Point</div>
	</header>

	<div class="login-wrap">
		<form class="login-box" id="loginform">
			<h3>Sign in</h3>
			<input id="user" type="text" placeholder="Username" autocomplete="username" autofocus>
			<input id="pass" type="password" placeholder="Password" autocomplete="current-password">
			<button type="submit">Login</button>
			<div class="login-err" id="err"></div>
		</form>
	</div>

	<script>
		if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

		fetch('get_ap_config').then(r => r.json()).then(d => {
			if (d && d.alias) {
				document.querySelector('.logo').textContent = d.alias;
				document.title = 'Login – ' + d.alias;
			}
		}).catch(() => { });

		document.getElementById('loginform').addEventListener('submit', async (e) => {
			e.preventDefault();
			const err = document.getElementById('err');
			err.textContent = '';
			const fd = new FormData();
			fd.append('user', document.getElementById('user').value);
			fd.append('pass', document.getElementById('pass').value);
			try {
				const r = await fetch('login', { method: 'POST', body: fd });
				if (r.ok) {
					location.href = '/';
				} else {
					err.textContent = 'Wrong username or password';
					document.getElementById('pass').value = '';
				}
			} catch (e) {
				err.textContent = 'Connection error';
			}
		});
	</script>
</body>

</html>
